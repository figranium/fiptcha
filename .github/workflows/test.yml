name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Check MLX worker Python syntax
        run: python3 -m py_compile scripts/captcha-mlx-worker.py

  live-captcha:
    if: contains(github.event.head_commit.message, '[live-captcha]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/captcha-live.test.js
